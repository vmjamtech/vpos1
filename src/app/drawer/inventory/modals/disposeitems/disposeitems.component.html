<ion-header>
  <ion-toolbar color="primary">
    <ion-title style="margin-top: 20px">Disposed Items</ion-title>
    <ion-buttons slot="end" style="margin-top: 20px">
      <ion-button (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-refresher
    slot="fixed"
    (ionRefresh)="doRefresh($event)"
    [pullFactor]="0.5"
    [pullMin]="100"
    [pullMax]="200"
  >
    <ion-refresher-content
      pullingIcon="arrow-down-outline"
      pullingText="Pull to refresh"
      refreshingSpinner="crescent"
      refreshingText="Refreshing..."
    ></ion-refresher-content>
  </ion-refresher>

  <div class="search-container">
    <ion-searchbar
      [debounce]="300"
      [placeholder]="searchFieldLabels[searchField]"
      [(ngModel)]="searchValue"
      (ionInput)="onSearchChange()"
    ></ion-searchbar>

    <ion-button fill="clear" (click)="selectSearchField()" class="filter-btn">
      <ion-icon name="funnel-outline"></ion-icon>
    </ion-button>

    <ion-button fill="clear" (click)="selectDisposeFilter()" class="filter-btn">
      <ion-icon name="filter-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="product-list-container">
    <!-- Skeleton Loader -->
    <ion-list
      *ngIf="isLoading && filteredItems.length === 0"
      lines="none"
      class="product-list card-list"
    >
      <ion-item *ngFor="let skeleton of skeletonArray">
        <ion-label>
          <h2>
            <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
          </h2>
          <div class="meta">
            <ion-skeleton-text animated style="width: 40%"></ion-skeleton-text>
          </div>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Real Data -->
    <ion-list
      *ngIf="!isLoading && filteredItems.length > 0"
      lines="none"
      class="product-list card-list"
    >
      <ion-item-sliding
        *ngFor="let item of filteredItems"
        [disabled]="item.disremarks === 'DISPOSED'"
      >
        <ion-item (click)="showOptionsSheet(item)">
          <ion-label>
            <div class="meta">
              <strong>Date:</strong>
              {{ item.disdate | date : "yyyy-MM-dd hh:mm:ss a" }}
            </div>
            <h2 class="desc">
              {{ item.disitemcode }} - {{ item.disitemdesc }}
            </h2>

            <div class="meta"><strong>Quantity:</strong> {{ item.disqty }}</div>

            <div class="meta">
              <strong>Disposed By:</strong> {{ item.disby }}
            </div>

            <div class="meta">
              <strong>Note:</strong> {{ item.DisposeNote }}
            </div>
          </ion-label>
          <ion-badge
            class="status-badge"
            [color]="item.disremarks === 'DISPOSED' ? 'danger' : 'success'"
          >
            {{ item.disremarks }}
          </ion-badge>
        </ion-item>
        <!-- Swipe to delete -->
        <ion-item-options side="end">
          <ion-item-option color="danger" (click)="deleteItemConfirm(item)">
            <ion-icon name="trash-outline"></ion-icon> Delete
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    </ion-list>

    <!-- Empty State -->
    <div *ngIf="!isLoading && filteredItems.length === 0" class="empty-state">
      <ion-icon name="cube-outline"></ion-icon>
      <p>No data found.</p>
    </div>
  </div>
  <!-- Infinite Scroll -->
  <ion-infinite-scroll
    threshold="100px"
    (ionInfinite)="loadMore($event)"
    [disabled]="isLoading"
  >
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Loading more data..."
    ></ion-infinite-scroll-content>
  </ion-infinite-scroll>
  <ion-fab
    vertical="bottom"
    horizontal="end"
    slot="fixed"
    class="fab-custom"
    (click)="openAddItemModal()"
  >
    <ion-fab-button color="primary">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
