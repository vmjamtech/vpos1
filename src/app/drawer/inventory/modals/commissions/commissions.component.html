<ion-header>
  <ion-toolbar color="primary">
    <ion-title style="margin-top: 20px">Item Commission</ion-title>
    <ion-buttons slot="end" style="margin-top: 20px">
      <ion-button (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher
    slot="fixed"
    (ionRefresh)="doRefresh($event)"
    [pullFactor]="0.5"
    [pullMin]="100"
    [pullMax]="200"
  >
    <ion-refresher-content
      pullingIcon="arrow-down-outline"
      pullingText="Pull to refresh"
      refreshingSpinner="crescent"
      refreshingText="Refreshing..."
    ></ion-refresher-content>
  </ion-refresher>

  <!-- Search Section -->
  <div class="search-container">
    <ion-searchbar
      [debounce]="300"
      [placeholder]="searchFieldLabels[searchField]"
      [(ngModel)]="searchValue"
      (ionInput)="onSearchChange()" 
    ></ion-searchbar>

    <ion-button fill="clear" (click)="selectSearchField()" class="filter-btn">
      <ion-icon name="funnel-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="category-container">
    <div class="category-scroll">
      <ion-chip
        *ngFor="let cat of categories"
        (click)="selectCategory(cat.category)"
        [ngClass]="{ selected: selectedCategory === cat.category }"
        class="category-chip"
      >
        <ion-label>{{ cat.category }}</ion-label>
      </ion-chip>
    </div>
  </div>

  <div class="product-list-container">
    <!-- Skeleton Loader -->
    <ion-list
      *ngIf="isLoading && filteredItems.length === 0"
      lines="none"
      class="product-list card-list"
    >
      <ion-item *ngFor="let skeleton of skeletonArray">
        <ion-label>
          <h2>
            <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
          </h2>
          <div class="meta">
            <ion-skeleton-text animated style="width: 40%"></ion-skeleton-text>
          </div>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Real Data -->
    <ion-list
      *ngIf="!isLoading && items.length > 0"
      lines="none"
      class="product-list card-list"
    >
      <ion-item *ngFor="let item of filteredItems" (click)="openEditCommissionModal(item)">
        <ion-label>
          <h2 class="desc">{{ item.itemcode }} ({{ item.itemname }})</h2>
          <div class="meta">
            <span><strong>Size:</strong> {{ item.itemsize || "" }}</span>
          </div>
          <div class="meta">
            <span
              ><strong>Pick Up:</strong> ₱{{
                item.compickup | number : "1.2-2"
              }}</span
            >
            <span
              ><strong>Deliver:</strong> ₱{{
                item.comdel | number : "1.2-2"
              }}</span
            > 
          </div>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- No Products Found -->
    <div *ngIf="!isLoading && filteredItems.length === 0" class="empty-state">
      <ion-icon name="cube-outline"></ion-icon>
      <p>No data found.</p>
    </div>

    <!-- Infinite Scroll -->
    <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)">
      <ion-infinite-scroll-content
        loadingSpinner="bubbles"
        loadingText="Loading more products..."
      >
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div> 
</ion-content>
