<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{
      mode === "edit" ? "Update Petty Cash" : "Add Petty Cash"
    }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="form-container">
    <ion-item class="stacked-item">
      <ion-label position="stacked">Action</ion-label>
      <ion-select
        [(ngModel)]="pettylogtype"
        placeholder="Select"
        interface="popover"
      >
        <ion-select-option value="CASH IN">CASH IN</ion-select-option>
        <ion-select-option value="CASH OUT">CASH OUT</ion-select-option>
      </ion-select>
    </ion-item>
    <ion-item class="stacked-item">
      <ion-label position="stacked">Amount</ion-label>

      <ion-input
        type="number"
        [(ngModel)]="pettylogamount"
        placeholder="0.00"
      ></ion-input>
    </ion-item>

    <ion-item class="stacked-item">
      <ion-label position="stacked">Payment Method</ion-label>
      <ion-select
        [(ngModel)]="pettypaymenthod"
        placeholder="Select"
        interface="popover"
      >
        <ion-select-option value="CASH">CASH</ion-select-option>
        <ion-select-option value="GCASH">GCASH</ion-select-option>
        <ion-select-option value="BANK TRANSFER"
          >BANK TRANSFER</ion-select-option
        >
      </ion-select>
    </ion-item>

    <ion-item class="stacked-item">
      <ion-label position="stacked">Remarks</ion-label>

      <ion-input
        type="text"
        [(ngModel)]="pettylogremarks"
        placeholder="Enter Remarks"
      ></ion-input>
    </ion-item>
  </div>
  <ion-button
    class="sticky-btn"
    expand="block"
    color="primary"
    (click)="savePettyCash()"
    [disabled]="
      !pettylogtype || !pettylogamount || !pettypaymenthod || !pettylogremarks
    "
  >
    Confirm
  </ion-button>
</ion-content>
