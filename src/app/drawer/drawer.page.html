<div>
  <!-- <ion-badge class="trial-badge" color="warning"> TRIAL </ion-badge> -->
  <ion-split-pane contentId="main-content">
    <ion-menu
      class="menu-type-reveal"
      style="--width: {{drawerWidth}}px"
      side="start"
      menuId="main-menu"
      contentId="main-content"
      type="my-reveal"
      [swipeGesture]="false"
      [maxEdgeStart]="platform.width()"
    >
      <div class="headerToolbar">
        <div class="userContainer">
          <ion-avatar class="userImage" (click)="printBusinessDetails()">
            <ion-img [src]="Blogo" loading="lazy" alt="User Image"></ion-img>
          </ion-avatar>

          <div class="userInfoContainer" *ngIf="user">
            <div class="userId">{{ user.empname }}</div>
            <div class="stcodeRow">
              <span class="stcode">{{ user.usern }}</span>
              <span class="stname">{{ user.accnttype }}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="divider"></div>
      <ion-content>
        <ion-list class="ion-no-padding">
          <ion-menu-toggle
            auto-hide="false"
            *ngFor="let p of appPages"
            #drawerItemList
          >
            <ion-item
              class="drawerItem"
              lines="none"
              detail="false"
              routerDirection="root"
              [routerLink]="p.url ? [p.url] : undefined"
              (click)="onDrawerNavigate(p)"
            >
              <ion-item
                class="drawerInnerItem"
                [style.--width]="rowWidth + 'px'"
                [style.--background]="activeTab === p.name ? 'rgba(212, 175, 55, 0.2)' : 'transparent'"
                lines="none"
              ></ion-item>

              <!-- Use ion-icon for standard icons -->
              <ion-icon
                *ngIf="!p.isAsset"
                [name]="p.icon"
                class="icon-margin"
                [ngClass]="{
        'iconActive': activeTab === p.name,
        'iconInactive': activeTab !== p.name
      }"
                style="width: 24px; height: 24px"
              ></ion-icon>

              <!-- Use ion-img for asset icons -->
              <ion-img
                *ngIf="p.isAsset"
                style="width: 24px; height: 24px"
                class="icon-margin"
                [ngClass]="{'imgTintBlue': activeTab === p.name, 'imgTintBlack': activeTab !== p.name}"
                src="assets/home/supportIcon.png"
                [alt]="p.name"
              ></ion-img>

              <ion-label
                style="font-weight: 500; font-size: 16px; margin-left: 8px"
                [style.color]="activeTab === p.name ? 'var(--ion-text-color)' : 'var(--color-nearlyBlack)'"
              >
                {{ p.name }}
              </ion-label>
            </ion-item>
          </ion-menu-toggle>
        </ion-list>
      </ion-content>
      <div class="divider"></div>
      <ion-footer class="ion-no-border">
        <ion-toolbar class="ion-no-padding">
          <ion-item
            button="true"
            detail="false"
            lines="none"
            (click)="signOut()"
          >
            <ion-label class="sign-out-text">Sign Out</ion-label>
            <i class="material-icons colorRed">power_settings_new</i>
          </ion-item>
        </ion-toolbar>
      </ion-footer>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>

  <!-- Reference:- https://codepen.io/carlosriera/pen/qNgAEo/ -->
  <!-- [ngClass]="{'open': isMenuActive === true}" -->
  <div
    style="position: absolute"
    class="menu menu--back5 ion-activatable"
    (click)="onMenuClick()"
    [hidden]="isSplitPane || activeTab === 'POS'"
    #menuIcon
  >
    <div class="menu__icon">
      <div class="menu__line menu__line--1"></div>
      <div class="menu__line menu__line--2"></div>
      <div class="menu__line menu__line--3"></div>
    </div>
    <ion-ripple-effect type="unbounded"></ion-ripple-effect>
  </div>
</div>
