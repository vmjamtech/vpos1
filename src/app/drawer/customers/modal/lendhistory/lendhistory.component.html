<ion-header>
  <ion-toolbar color="primary">
    <ion-title style="margin-top: 20px">Lend Items History</ion-title>
    <ion-buttons slot="end" style="margin-top: 20px">
      <ion-button (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content [scrollEvents]="true">
  <ion-refresher
    slot="fixed"
    (ionRefresh)="doRefresh($event)"
    [pullFactor]="0.5"
    [pullMin]="100"
    [pullMax]="200"
  >
    <ion-refresher-content
      pullingIcon="arrow-down-outline"
      pullingText="Pull to refresh"
      refreshingSpinner="crescent"
      refreshingText="Refreshing..."
    ></ion-refresher-content>
  </ion-refresher>

  <app-date-range-display
    [dateFrom]="currentDateFrom"
    [dateTo]="currentDateTo"
  ></app-date-range-display>

  <div class="search-container">
    <ion-searchbar
      [debounce]="300"
      [placeholder]="searchFieldLabels[searchField]"
      [(ngModel)]="searchValue"
      (ionInput)="onSearchChange()"
    ></ion-searchbar>

    <ion-button fill="clear" (click)="selectSearchField()" class="filter-btn">
      <ion-icon name="funnel-outline"></ion-icon>
    </ion-button>

    <ion-button fill="clear" (click)="openFilter()" class="filter-btn">
      <ion-icon name="filter-outline"></ion-icon>
    </ion-button>
  </div>

  <div class="product-list-container">
    <!-- Skeleton Loader -->
    <ion-list
      *ngIf="isLoading && filteredItems.length === 0"
      lines="none"
      class="product-list card-list"
    >
      <ion-item *ngFor="let skeleton of skeletonArray">
        <ion-label>
          <h2>
            <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
          </h2>
          <div class="meta">
            <ion-skeleton-text animated style="width: 40%"></ion-skeleton-text>
          </div>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Real Data -->
    <ion-list
      *ngIf="!isLoading && filteredItems.length > 0"
      lines="none"
      class="product-list card-list"
    >
      <ion-item *ngFor="let item of filteredItems">
        <ion-label>
          <div class="meta">
            <strong>Date:</strong>
            {{ item.itemhdate | date : "yyyy-MM-dd hh:mm:ss a" }}
          </div>
          <div class="meta">
            <strong>Reference Number:</strong> {{ item.lendrefnum }}
          </div>
          <div class="meta">
            <strong>Customer:</strong> {{ item.lendcustname }}
          </div>
          <div class="meta">
            <strong>Item:</strong> {{ item.itemhitemc }} -
            {{ item.lenditemname }}
          </div>

          <div class="meta"><strong>Quantity:</strong> {{ item.itemhqty }}</div>

          <ion-badge class="status-badge" [color]="item.status === 'LENDED' ? 'danger' : 'success'">
            {{ item.status }}
          </ion-badge>
        </ion-label>
      </ion-item>
    </ion-list>

    <!-- Empty State -->
    <div *ngIf="!isLoading && filteredItems.length === 0" class="empty-state">
      <ion-icon name="cube-outline"></ion-icon>
      <p>No data found.</p>
    </div>
  </div>
  <!-- Infinite Scroll -->
  <ion-infinite-scroll
    threshold="150px"
    (ionInfinite)="loadMore($event)"
    [disabled]="allLoaded || isSearching"
  >
    <ion-infinite-scroll-content
      loadingSpinner="bubbles"
      loadingText="Loading more data..."
    ></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
