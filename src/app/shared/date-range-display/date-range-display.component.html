<div class="date-filter-container">
  <ion-grid fixed class="date-filter">
    <ion-row>
      <ion-col size="6">
        <ion-item lines="none" class="date-item">
          <ion-label position="stacked">Date From</ion-label>
          <input
            type="text"
            readonly
            tabindex="-1"
            aria-label="Date From"
            [value]="dateFrom || 'All'"
          />
        </ion-item>
      </ion-col>

      <ion-col size="6">
        <ion-item lines="none" class="date-item">
          <ion-label position="stacked">Date To</ion-label>
          <input
            type="text"
            readonly
            tabindex="-1"
            aria-label="Date To"
            [value]="dateTo || 'All'"
          />
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>
